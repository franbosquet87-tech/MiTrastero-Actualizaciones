function supportsPersistentStorage(){

let categories=loadCategories(),items=loadItems(),savedPlaces=loadPlaces(),tab='home',filter='Todos',search='',locationFilter=null,photoDraft='',prevTab='home',currentCat=null,statusFilter='all';

function getCat(id){return categories.find(c=>c.id===id)||null}
function catChain(id){const path=[],seen=new Set();let c=getCat(id);while(c&&!seen.has(c.id)){path.unshift(c);seen.add(c.id);c=getCat(c.parentId)}return path}
function catPath(id){return catChain(id).map(c=>c.name).join(' › ')}
function catOf(i){return catPath(i.catId)||i.category||'Sin clasificar'}
function descendants(id){const out=new Set([id]);let changed=true;while(changed){changed=false;for(const c of categories)if(!out.has(c.id)&&out.has(c.parentId)){out.add(c.id);changed=true}}return out}
function inBranch(i,id){return !id||descendants(id).has(i.catId)}
function catCount(id){const all=descendants(id);return items.filter(i=>all.has(i.catId)).length}
function flatCategories(){const out=[],stack=categories.filter(c=>c.parentId===null).reverse().map(c=>({c,depth:0}));const visited=new Set();while(stack.length){const {c,depth}=stack.pop();if(visited.has(c.id))continue;visited.add(c.id);out.push({c,depth});const children=categories.filter(x=>x.parentId===c.id);for(let j=children.length-1;j>=0;j--)stack.push({c:children[j],depth:depth+1})}return out}
function categoryOptions(selected){return flatCategories().map(({c,depth})=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc('  '.repeat(depth)+'↳ '.repeat(depth)+c.name)}</option>`).join('')}
function migrateCategoryIds(){let updated=false;const demoIds={i1:'c-18v',i2:'c-sockets',i3:'c-saws',i4:'c-angle'};for(const i of items){if(!getCat(i.catId)){i.catId=demoIds[i.id]&&i.category==='Herramientas'?demoIds[i.id]:(categories.find(c=>c.parentId===null&&c.name===i.category)?.id||'c-other');updated=true}i.category=catOf(i)}if(updated)try{localStorage.setItem(KEY,JSON.stringify(items))}catch(_){}}

function persist(){
 if(temporaryStorageMode){syncStorageNotice();return true;}
 try{
  localStorage.setItem(KEY,JSON.stringify(items));
  localStorage.setItem(CAT_KEY,JSON.stringify(categories));
  localStorage.setItem(PLACES_KEY,JSON.stringify(savedPlaces));
  return true;
 }catch(e){
  // Si un navegador revoca el acceso al almacenamiento a mitad de la sesión, se pasa a modo demo.
  if(e && (e.name==='SecurityError'||e.name==='NotSupportedError')){
   temporaryStorageMode=true;syncStorageNotice();return true;
  }
  toast('No se han podido guardar los datos. Comprueba si hay espacio disponible.');
  return false;
 }
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// V1.7: cantidad = número de piezas; medida opcional = tamaño/capacidad de CADA pieza.
// Un registro legado con qtyUnit=m/kg/l NO equivale a ese número de unidades.
// Se conserva y se muestra con su unidad original hasta que el usuario lo edite.
const MEASURE_UNITS={mm:'Milímetros (mm)',cm:'Centímetros (cm)',m:'Metros (m)',m2:'Metros cuadrados (m²)',g:'Gramos (g)',kg:'Kilogramos (kg)',ml:'Mililitros (ml)',l:'Litros (L)'};
const UNIT_SYMBOLS={mm:'mm',cm:'cm',m:'m',m2:'m²',g:'g',kg:'kg',ml:'ml',l:'L'};
function normalizedQtyUnit(u){return u==='ud'||!u?'ud':Object.prototype.hasOwnProperty.call(MEASURE_UNITS,u)?u:'ud'}
function normalizedMeasureUnit(u){return Object.prototype.hasOwnProperty.call(MEASURE_UNITS,u)?u:'cm'}
function isLegacyMeasured(i){return normalizedQtyUnit(i.qtyUnit)!=='ud'}
function formatQtyValue(n){const v=Number(n);return Number.isFinite(v)?new Intl.NumberFormat('es-ES',{maximumFractionDigits:3}).format(v):'0'}
function quantityLabel(i){const n=Number(i.qty);return isLegacyMeasured(i)?formatQtyValue(n)+' '+UNIT_SYMBOLS[normalizedQtyUnit(i.qtyUnit)]+' (formato anterior)':formatQtyValue(n)+' '+(n===1?'unidad':'unidades')}
function measurementLabel(i){const v=Number(i.measureValue);return i.measureValue!==null&&i.measureValue!==undefined&&i.measureValue!==''&&Number.isFinite(v)&&v>0?formatQtyValue(v)+' '+UNIT_SYMBOLS[normalizedMeasureUnit(i.measureUnit)]+'':''}
function objectSummaryLabel(i){const m=measurementLabel(i);return quantityLabel(i)+(m?' · '+m:'')}
function unitOptions(selected){return Object.entries(MEASURE_UNITS).map(([k,label])=>`<option value="${k}" ${k===selected?'selected':''}>${label}</option>`).join('')}

function appDialog(message,title='Confirmar',danger=false,needsChoice=true){
 return new Promise(resolve=>{
   const root=document.getElementById('dialog-root');
   if(!root){resolve(false);return;}
   const panel=document.createElement('div');panel.className='app-dialog-shade';
   panel.innerHTML=`<div class="app-dialog-card" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><div class="app-dialog-title">${esc(title)}</div><div class="app-dialog-message">${esc(message)}</div><div class="app-dialog-buttons">${needsChoice?'<button type="button" class="app-dialog-cancel">Cancelar</button>':''}<button type="button" class="app-dialog-accept ${danger?'app-dialog-danger':''}">${needsChoice?(danger?'Eliminar':'Continuar'):'Entendido'}</button></div></div>`;
   const finish=choice=>{root.__dismiss=null;root.replaceChildren();resolve(choice)};
   root.__dismiss=()=>finish(false);
   panel.querySelector('.app-dialog-accept').addEventListener('click',()=>finish(true));
   panel.querySelector('.app-dialog-cancel')?.addEventListener('click',()=>finish(false));
   root.replaceChildren(panel);
 });
}
function closeAppDialog(){document.getElementById('dialog-root')?.__dismiss?.()}

function inTransit(i){return !!i.transit && !i.loan}
function countTransit(){return items.filter(inTransit).length}
function formattedHomePlace(i){return i.place+(i.location?' · '+i.location:'')}
// V2.2: historial independiente del tránsito ACTIVO. Se conserva al terminarlo.
// Los objetos creados en versiones anteriores mantienen todos sus datos. Si hay un
// tránsito abierto, reconstruimos únicamente las etapas conocidas, sin inventar horas.
function knownTransitMovements(i){
 if(Array.isArray(i.transitLog))return i.transitLog;
 const t=i.transit;if(!t||!t.note)return [];
 const stops=Array.isArray(t.history)?t.history:[];
 const events=[];let last=formattedHomePlace(i);
 for(const stop of stops){
  const dest=typeof stop==='string'?stop:(stop&&typeof stop==='object'?(stop.note||stop.place):'');
  if(!dest)continue;
  events.push({kind:events.length?'nuevo':'inicio',from:last,to:dest,at:typeof stop==='object'?(stop.since||''):'' ,imported:true});
  last=dest;
 }
 events.push({kind:events.length?'nuevo':'inicio',from:last,to:t.note,at:t.since||'',imported:true});
 return events;
}
function movementRecord(kind,from,to){return {kind,from:String(from||''),to:String(to||''),at:new Date().toISOString()};}
function appendMovement(i,kind,from,to){i.transitLog=[...knownTransitMovements(i),movementRecord(kind,from,to)];}
function revertMovementLog(i,oldLog){if(oldLog===undefined)delete i.transitLog;else i.transitLog=oldLog;}
function transitLogLabel(kind){return ({inicio:'Inicio del tránsito',nuevo:'Nuevo destino temporal',regreso:'Regreso al lugar habitual',habitual:'Nuevo lugar habitual',prestamo:'Salida por préstamo'})[kind]||'Movimiento';}
function transitLogDate(value){
 if(!value)return 'Fecha no registrada';
 if(/^\d{4}-\d{2}-\d{2}$/.test(value)){const [year,month,day]=value.split('-');return day+'/'+month+'/'+year+' · hora no registrada';}
 const d=new Date(value);return Number.isNaN(d.getTime())?'Fecha no registrada':new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
}
function viewTransitHistory(id){
 const i=items.find(v=>v.id===id);if(!i){appAlert('No se encuentra el objeto.');return;}
 const log=knownTransitMovements(i);
 const body=log.length?log.map((ev,index)=>({ev,index})).reverse().map(({ev,index})=>`<div class="transit-history-entry" style="position:relative;padding-right:72px"><span class="move-title">${esc(transitLogLabel(ev.kind))}</span><span class="move-date">${esc(transitLogDate(ev.at))}</span><span class="move-route">${esc(ev.from||'Origen no registrado')}<span class="move-arrow">→</span>${esc(ev.to||'Destino no registrado')}</span><button type="button" class="transit-history-delete" onclick="deleteTransitHistoryEntry('${esc(i.id)}',${index})" aria-label="Eliminar este movimiento" title="Eliminar este movimiento">Eliminar</button></div>`).join(''):
 '<div class="transit-history-empty">Todavía no hay movimientos registrados. Los próximos tránsitos quedarán guardados aquí, incluso cuando el objeto vuelva a su lugar habitual.</div>';
 openModal(`<div class="sheet-top"><h2>Historial de tránsitos</h2><button type="button" class="close" onclick="closeModal()" aria-label="Cerrar">${icon('close')}</button></div><p class="desc" style="margin:10px 0 15px"><b>${esc(i.name)}</b> · ${log.length} ${log.length===1?'movimiento':'movimientos'}</p>${body}<p class="desc" style="margin:12px 0">Eliminar una anotación solo borra ese registro del historial; no cambia la ubicación actual del objeto.</p><button type="button" class="secondary" onclick="details('${esc(i.id)}')">Volver a la ficha</button>`);
}
async function deleteTransitHistoryEntry(id,index){
 const i=items.find(v=>v.id===id);if(!i)return appAlert('No se encuentra el objeto.');
 const log=knownTransitMovements(i);
 if(!Number.isInteger(index)||index<0||index>=log.length)return appAlert('Este movimiento ya no existe.');
 const ev=log[index];
 if(!await appConfirm('¿Eliminar únicamente este movimiento del historial?\n\n'+(ev.from||'Origen no registrado')+' → '+(ev.to||'Destino no registrado')+'\n\nLa ubicación actual del objeto no cambiará.','Eliminar movimiento'))return;
 const oldLog=i.transitLog;
 i.transitLog=log.filter((_,n)=>n!==index);
 if(!persist()){
  revertMovementLog(i,oldLog);
  appAlert('No se ha podido guardar la eliminación. No se ha modificado el historial.','Error al guardar');
  return;
 }
 viewTransitHistory(id);
 toast('Movimiento eliminado del historial');
}

function saveCategory(e,editId,parentId){
  e.preventDefault();const name=document.getElementById('cat-name').value.trim(), emoji=document.getElementById('cat-emoji').value||'📁';if(!name)return showFormError('Escribe el nombre obligatorio de la categoría.','cat-name');

function saveItem(e,id){

 const measureValue=rawMeasure!==''?Number(rawMeasure):null;
 const measureUnit=normalizedMeasureUnit(String(fd.get('measureUnit')||'cm'));

 let place=String(fd.get('place')||'');

 else place=place.trim();
 if(!name){showSaveError('Escribe el nombre del objeto.','name');return false;}
 if(!getCat(catId)){showSaveError('Selecciona una categoría válida. Si no aparece ninguna, crea una en «Categorías».','category');return false;}
 if(!Number.isSafeInteger(qty)||qty<=0||qty>999999){showSaveError('Indica cuántas unidades tienes. Debe ser un número entero mayor que cero, por ejemplo 1 o 3.','qty');return false;}
 if(rawMeasure!==''&&(!Number.isFinite(measureValue)||measureValue<=0||measureValue>999999)){showSaveError('La medida debe ser un número positivo. Puedes usar decimales con coma, por ejemplo 2,5.','measureValue');return false;}
 if(!place){showSaveError('Selecciona un espacio o escribe el nombre del lugar nuevo.','place');return false;}

 const previousItems=items.map(v=>({...v}));

// Copia local compatible con el mismo esquema de datos de esta demostración.
// Cuando corre como APK, Android abre "Guardar como". En navegador HTML se usa descarga normal.
function saveLocalFile(filename,mime,text){
 if(window.MiTrasteroAndroid){
   const reader=new FileReader();
   reader.onload=()=>{
     try{
       const b64=String(reader.result).split(',')[1]||'';
       window.MiTrasteroAndroid.beginExport(filename,mime);
       for(let pos=0;pos<b64.length;pos+=40000)window.MiTrasteroAndroid.appendExport(b64.slice(pos,pos+40000));
       window.MiTrasteroAndroid.finishExport();
     }catch(e){toast('No se pudo preparar el archivo para guardar.');}
   };
   reader.onerror=()=>toast('No se pudo leer el archivo.');
   reader.readAsDataURL(new Blob([text],{type:mime}));
 }else{
   const url=URL.createObjectURL(new Blob([text],{type:mime}));
   const a=document.createElement('a');a.href=url;a.download=filename;
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),30000);
 }
}
function exportBackup(){
 try{
   const data=JSON.stringify({format:'mi-trastero-backup',version:1,createdAt:new Date().toISOString(),data:{items,categories,places:savedPlaces}});
   if(new Blob([data],{type:'application/json'}).size>30*1024*1024)throw Error('La copia supera el límite de restauración de 30 MB. Reduce fotografías antes de exportar.');
   const date=new Date(),pad=n=>String(n).padStart(2,'0');
   const filename=`Mi_Trastero_Copia_${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}_${pad(date.getHours())}-${pad(date.getMinutes())}.json`;
   saveLocalFile(filename,'application/json',data);
   toast('Selecciona dónde guardar la copia. Consérvala fuera del teléfono.');
 }catch(err){appAlert(err?.message||'No se ha podido generar la copia de seguridad.','Copia de seguridad');}
}

function readFileText(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(String(reader.result??''));
   reader.onerror=()=>reject(Error('Android no ha permitido leer el archivo seleccionado.'));
   reader.onabort=()=>reject(Error('La lectura se ha cancelado.'));
   try{reader.readAsText(file,'UTF-8')}catch(_){reject(Error('No se puede abrir ese archivo.'))}
 });
}
async function importBackup(event){
 const input=event.target, file=input.files?.[0];if(!file)return;
 try{
   if(file.size===0)throw Error('El archivo seleccionado está vacío (0 bytes). Elige la copia JSON de 1,5 KB que ya has guardado.');
   if(file.size>30*1024*1024)throw Error('La copia es demasiado grande (máximo 30 MB).');
   const raw=await readFileText(file);
   await restoreBackupFromText(raw);
 }catch(err){await appAlert(err?.message||'No se pudo leer la copia de seguridad.','Error de restauración')}
 finally{input.value=''}
}
// Android entrega texto a JavaScript por bloques: evita fallos con los URI content:// del WebView.
async function importBackupFromAndroid(){
 try{
   const bridge=window.MiTrasteroAndroid;
   if(!bridge)throw Error('El lector de archivos Android no está disponible.');
   const error=bridge.importError();
   if(error)throw Error(error);
   const count=bridge.importLength();
   if(count<=0)throw Error('Android no ha podido leer el archivo o está vacío (0 bytes).');
   const chunks=[];const SIZE=48000;
   for(let pos=0;pos<count;){
     const chunk=bridge.importChunk(pos,SIZE);
     if(!chunk)throw Error('No se pudo recuperar toda la copia del almacenamiento Android.');
     chunks.push(chunk);pos+=chunk.length;
     if(chunks.length%16===0)await new Promise(ok=>setTimeout(ok,0));
   }
   bridge.clearImport();
   await restoreBackupFromText(chunks.join(''));
 }catch(err){
   try{window.MiTrasteroAndroid?.clearImport()}catch(_){}
   await appAlert(err?.message||'No se pudo leer la copia.','Error de restauración');
 }
}
async function restoreBackupFromText(raw){
 if(!raw || !raw.trim())throw Error('La copia está vacía. Elige un archivo JSON que no tenga 0 bytes.');
 let backup;
 try{backup=JSON.parse(raw.replace(/^\uFEFF/,''));}
 catch(_){throw Error('El contenido del archivo no es un JSON válido. Comprueba que has elegido la copia correcta.');}
 if(backup?.format!=='mi-trastero-backup'||backup.version!==1||!backup.data)
   throw Error('El archivo no es una copia de Mi Trastero compatible con esta versión.');
 const {items:newItems,categories:newCategories,places:newPlaces}=backup.data;
 const validItems=Array.isArray(newItems)&&newItems.every(o=>o&&typeof o==='object'&&typeof o.id==='string'&&typeof o.name==='string'&&typeof o.place==='string'&&typeof o.catId==='string');
 const validCategories=Array.isArray(newCategories)&&newCategories.every(c=>c&&typeof c==='object'&&typeof c.id==='string'&&typeof c.name==='string');
 const validPlaces=Array.isArray(newPlaces)&&newPlaces.every(x=>typeof x==='string');
 if(!validItems||!validCategories||!validPlaces)throw Error('La copia contiene datos incompletos o incompatibles.');
 const count=newItems.length;
 if(!await appConfirm(`Se restaurarán ${count} objetos, ${newCategories.length} categorías y ${newPlaces.length} lugares. Esto sustituirá el inventario actual. ¿Continuar?`,'Restaurar copia'))return;
 const next=[[KEY,JSON.stringify(newItems)],[CAT_KEY,JSON.stringify(newCategories)],[PLACES_KEY,JSON.stringify(newPlaces)]];
 const before=next.map(([k])=>[k,localStorage.getItem(k)]);
 try{
   for(const [k,v] of next)localStorage.setItem(k,v);
 }catch(err){
   for(const [k,v] of before){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){}}
   throw Error('No queda espacio suficiente en el almacenamiento. Tus datos actuales se han conservado.');
 }
 items=newItems;categories=newCategories;savedPlaces=newPlaces;
 currentCat=null;filter='Todos';statusFilter='all';locationFilter=null;search='';
 closeModal();navigate('home');toast(`Copia restaurada correctamente: ${count} objetos.`);
}

 });

async function onNativeUpdateCheck(json){
 let d;try{d=JSON.parse(json)}catch(_){return;}
 if(d.status==='error'){updateStatus('No se pudo comprobar la actualización.');await appAlert(d.message||'No se ha podido conectar.','Actualizaciones');return;}
 if(d.status==='current'){updateStatus('Tienes instalada la versión más reciente: '+currentUpdateName());toast('Tu aplicación está al día.');return;}
 if(d.status==='available'){
   updateStatus('Disponible: '+d.version);
   const ok=await appConfirm('Hay una nueva interfaz ('+d.version+').\n\n'+(d.notes||'Mejoras disponibles.')+'\n\nSe actualizará solo la interfaz, sin borrar objetos, fotos ni lugares. Antes es recomendable guardar una copia de seguridad.','Actualización disponible');
   if(ok){updateStatus('Descargando y verificando actualización…');updaterBridge()?.install();}
 }
}

 setTimeout(()=>{updaterBridge()?.reloadUi();},400);
}


// V1.6: acciones de tránsito independientes del envío de formularios (HTML y vistas previas).
// Los avisos son visibles cuando hay datos obligatorios sin rellenar.
function dispatchTransitAction(button){
 const action=button.dataset.transitAction;
 const id=button.dataset.objectId;
 if(!id){showFormError('No se puede identificar el objeto. Cierra su ficha y vuelve a abrirla.');return;}
 try{
  switch(action){
   case 'open-start': return markTransit(id);
   case 'confirm-start': return saveTransit(null,id);
   case 'manage': return finishTransit(id);
   case 'open-next': return transitNextForm(id);
   case 'confirm-next': return commitTransitNext(null,id);
   case 'return-home': return transitHomeConfirm(id);
   case 'open-permanent': return transitPermanentForm(id);
   case 'confirm-permanent': return commitTransitPermanent(null,id);
   default: return showFormError('Operación desconocida.');
  }
 }catch(err){
  showFormError('No se completó la operación: '+String(err?.message||err||'error inesperado'));
 }
}
document.addEventListener('click', e=>{
 const target=e.target;
 const button=target && target.closest ? target.closest('[data-transit-action]') : null;
 if(!button)return;
 e.preventDefault();
 dispatchTransitAction(button);
});
document.getElementById('modal')?.addEventListener('submit',e=>{
 if(!e.target.matches('[data-transit-form]'))return;
 e.preventDefault();
 const button=e.target.querySelector('[data-transit-action^="confirm-"]');
 if(button)dispatchTransitAction(button);
 else showFormError('No se ha encontrado el botón de confirmación.');
});

document.getElementById('modal')?.addEventListener('input',e=>{if(e.target.closest('input,select,textarea'))clearFormError();});
document.getElementById('modal')?.addEventListener('change',e=>{if(e.target.closest('input,select,textarea'))clearFormError();});
window.addEventListener('error',e=>{const message='Error en la aplicación: '+(e.message||'operación no completada'); const errorBox=document.getElementById('modal-validation');if(errorBox){errorBox.hidden=false;errorBox.textContent=message;}else toast(message);});
window.addEventListener('unhandledrejection',e=>{const errorBox=document.getElementById('modal-validation');const message='No se completó la operación: '+String(e.reason?.message||e.reason||'error inesperado');if(errorBox){errorBox.hidden=false;errorBox.textContent=message;}else toast(message);});
// V2.2.5: el HTML inicial de la APK usa document.write durante el parseo.
// En WebView puede conservar el párrafo de carga y estilos en línea (padding 22px).
// Limpiarlos aquí corrige el ancho sin recompilar Android y no afecta al modo HTML normal.
(function corregirPantallaDeArranqueAndroid(){
 const body=document.body;
 if(!body)return;
 const style=body.getAttribute('style')||'';
 if(!style.includes('padding:22px'))return;
 for(const el of [...body.children]){
  if(el.tagName==='P' && /^Abriendo Mi Trastero[.…]*$/i.test(el.textContent.trim()))el.remove();
 }
 body.removeAttribute('style');
})();
migrateCategoryIds();
render();
renderUpdateVersion();
try{updaterBridge()?.uiReady()}catch(_){}
</script>
